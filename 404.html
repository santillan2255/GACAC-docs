<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <title>CoopApps — Documentación</title>
    <script>
      (function () {
        var base = "/GACAC-docs";
        var path = location.pathname;
        if (path.startsWith(base + '/')) {
          path = path.slice(base.length);
        }
        var segs = path.split('/').filter(Boolean);
        if (segs.length && segs[segs.length - 1].indexOf('.') < 0) {
          location.replace(base + path.replace(/\/?$/, '') + '.html' + location.search + location.hash);
          return;
        }
        location.replace(base + '/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>Redirigiendo…</body>
</html>
